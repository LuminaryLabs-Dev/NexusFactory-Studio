name: Validate Studio Receipt

on:
  push:
    branches: [main]
    paths:
      - 'scripts/validation-trigger.mjs'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Studio
        run: npm run validate
      - name: Record successful validation
        run: |
          mkdir -p .validation
          printf '{"schemaVersion":"nexusfactory.studio-validation/1","validatedCommit":"%s"}\n' "$GITHUB_SHA" > .validation/main.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .validation/main.json
          git commit -m "Record Studio validation"
          git push origin HEAD:main
